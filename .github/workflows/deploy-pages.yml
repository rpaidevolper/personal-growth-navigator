# main 有更新就把 App 發佈到 GitHub Pages
# 第一次使用前：repo Settings → Pages → Build and deployment → Source 選「GitHub Actions」
name: 部署網站（GitHub Pages）

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 確認資料已同步到 HTML
        run: python tools/build.py --check
      - name: 準備網站檔案
        run: |
          mkdir -p _site
          cp "output/個人成長導航系統.html" _site/index.html
          cp LICENSE _site/LICENSE.txt
          mkdir -p _site/packs
          cp data/packs/*.json _site/packs/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
