# 每次 push / PR 檢查 data/*.json 是否通過驗證，且 HTML 的 DATA 區塊已同步
name: 檢查框架資料

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 驗證資料並確認 HTML 已同步
        run: python tools/build.py --check
      - name: 確認範例框架包是有效 JSON
        run: |
          for f in data/packs/*.json; do
            python -c "import json,sys; json.load(open(sys.argv[1], encoding='utf-8'))" "$f" || exit 1
          done
