<!DOCTYPE html>
<html lang="zh-Hant-TW" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>個人成長導航系統</title>
<style>
:root{--bg:#f5f7fb;--card:#ffffff;--ink:#1c2333;--muted:#5f6b80;--line:#e2e7f0;--accent:#2f6fde;--accent2:#14a37f;--warn:#e08a1e;--bad:#d64545;--soft:#eaf1fd;--chip:#f0f3f8}
@media (prefers-color-scheme: dark){:root{--bg:#12161f;--card:#1b2130;--ink:#e8ecf4;--muted:#9aa6bb;--line:#2c3446;--accent:#6b9cff;--accent2:#3dd1a5;--warn:#f0a548;--bad:#ff7b7b;--soft:#22304a;--chip:#252d3f}}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC","PingFang TC",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
header{padding:18px 24px 0;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{margin:0;font-size:22px}
.sub{color:var(--muted);margin-block-start:2px;font-size:13px}
nav{display:flex;gap:6px;padding:14px 24px 0;flex-wrap:wrap;border-block-end:1px solid var(--line)}
nav button{border:0;background:none;color:var(--muted);padding:8px 12px 10px;font-size:14px;cursor:pointer;border-block-end:3px solid transparent;font-family:inherit;display:flex;align-items:center;gap:7px}
nav button .n{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);font-size:12px;font-weight:700;color:var(--muted)}
nav button.done .n{background:var(--accent2);border-color:var(--accent2);color:#fff}
nav button.on{color:var(--accent);border-block-end-color:var(--accent);font-weight:700}
nav button.on .n{border-color:var(--accent);color:var(--accent)}
nav button.on.done .n{background:var(--accent2);border-color:var(--accent2);color:#fff}
nav button.lock{opacity:.5;cursor:not-allowed}
main{padding:20px 24px 48px;max-width:1200px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(280px,100%),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h2{font-size:16px;margin:0 0 10px}
.card h3{font-size:14px;margin:0 0 6px}
.kpi .n{font-size:26px;font-weight:700}
.kpi .l{color:var(--muted);font-size:12px}
label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
input,select,textarea{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink);font-family:inherit;font-size:13px}
textarea{min-height:64px}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:7px;padding:7px 14px;cursor:pointer;font-size:13px;font-family:inherit}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12px}
.btn.lg{padding:10px 20px;font-size:15px;font-weight:700}
.btn.danger{border-color:var(--bad);color:var(--bad);background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
table{width:100%;border-collapse:collapse}
th,td{text-align:start;padding:7px 6px;border-block-end:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600}
.tbl{overflow-x:auto}
.chip{display:inline-block;background:var(--chip);border-radius:20px;padding:1px 9px;font-size:12px;margin-block:2px;margin-inline-end:4px;color:var(--muted)}
.chip.c{background:#e6f0ff;color:#2457b8}.chip.s{background:#e3f7ef;color:#0f7a5d}.chip.a{background:#fdf0e1;color:#9a5a0a}.chip.o{background:#f6e7fb;color:#7d2d99}.chip.r{background:var(--chip);color:var(--muted)}
.chip.add{cursor:pointer;border:1px dashed var(--line)}.chip.add:hover{border-color:var(--accent);color:var(--accent)}
@media (prefers-color-scheme: dark){.chip.c{background:#1f3357;color:#9cc0ff}.chip.s{background:#163d33;color:#7fe3c4}.chip.a{background:#45331a;color:#f5c27f}.chip.o{background:#3b2445;color:#e0a8f5}}
.bar{height:8px;background:var(--chip);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent2)}
.gap{font-weight:700}
.gap.h{color:var(--bad)}.gap.m{color:var(--warn)}.gap.l{color:var(--accent2)}
.rec{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--card)}
.rec .t{font-weight:700}
.rec .why{font-size:12px;color:var(--muted)}
.score{font-size:12px;font-weight:700;color:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:12px}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:900px){.kanban{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.kanban{grid-template-columns:1fr}header,nav,main{padding-inline:16px}}
.col{background:var(--soft);border-radius:10px;padding:10px;min-height:120px}
.col h3{font-size:13px;margin:2px 4px 8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-block-end:8px}
.item .t{font-weight:600;font-size:13px}
.item input[type=range]{padding:0}
.hide{display:none}
.lv{width:62px}
.note{background:var(--soft);border-radius:8px;padding:10px 12px;font-size:13px}
.pitch{white-space:pre-wrap;font-family:inherit;background:var(--chip);border-radius:8px;padding:12px;font-size:13px;margin:0}
svg text{fill:var(--muted);font-size:11px}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-block-end:12px}
.filters button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:20px;padding:4px 12px;cursor:pointer;font-family:inherit}
.filters button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.toast{position:fixed;inset-block-end:20px;inset-inline-end:20px;background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:30}
.toast.on{opacity:.95}
/* 檢核清單 / 精靈 */
.check{display:flex;flex-direction:column;gap:8px}
.check .it{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
.check .it.done{border-color:var(--accent2);background:color-mix(in srgb,var(--accent2) 8%,var(--card))}
.check .it.cur{border-color:var(--accent);background:var(--soft)}
.check .mk{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;border:2px solid var(--line);color:var(--muted);flex:none}
.check .it.done .mk{background:var(--accent2);border-color:var(--accent2);color:#fff}
.check .it.cur .mk{border-color:var(--accent);color:var(--accent)}
.steps{display:flex;gap:4px;flex-wrap:wrap;margin-block-end:14px}
.steps button{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:20px;padding:4px 12px;cursor:pointer;font-family:inherit;font-size:12px}
.steps button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.steps button.done{color:var(--accent2);border-color:var(--accent2)}
.wiz{max-width:720px}
.lvopt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:2px solid var(--line);border-radius:10px;cursor:pointer;margin-block-end:8px;background:var(--card)}
.lvopt:hover{border-color:var(--accent)}
.lvopt.on{border-color:var(--accent);background:var(--soft)}
.lvopt .n{width:28px;height:28px;border-radius:50%;background:var(--chip);display:inline-flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.lvopt.on .n{background:var(--accent);color:#fff}
.lvopt .d{font-size:13px}
.lvopt .d b{display:block;font-size:13px}
.prog{height:6px;background:var(--chip);border-radius:4px;overflow:hidden;margin:6px 0 14px}
.prog>i{display:block;height:100%;background:var(--accent)}
.rolecard{cursor:pointer;border-width:2px}
.rolecard.on{border-color:var(--accent);background:var(--soft)}
.sec{margin-block-end:22px}
.sec>h2{font-size:17px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
.lvchips{display:flex;flex-wrap:wrap;gap:6px}
.lvchips .chip{cursor:pointer}
.lvchips .chip b{color:var(--accent)}
/* 模擬 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat .l{font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
.stat .bar{margin-block-start:4px}
.stat.depth .bar>i{background:var(--accent)}.stat.impact .bar>i{background:var(--accent2)}.stat.vis .bar>i{background:#9b59b6}.stat.energy .bar>i{background:var(--warn)}
.stat .d{font-size:11px;font-weight:700}.stat .d.up{color:var(--accent2)}.stat .d.dn{color:var(--bad)}
.pick{cursor:pointer;border-width:2px}
.pick.on{border-color:var(--accent);background:var(--soft)}
.pick.off{opacity:.45;cursor:not-allowed}
.route{display:grid;grid-template-columns:repeat(20,1fr);gap:3px}
.route>i{display:block;height:18px;border-radius:3px;background:var(--chip)}
.route>i.c{background:#2457b8}.route>i.s{background:#0f7a5d}.route>i.a{background:#c77d1a}.route>i.o{background:#7d2d99}.route>i.r{background:var(--line)}
.route>i.ev{outline:2px solid var(--bad);outline-offset:-2px}
.panel{position:fixed;inset-block-start:60px;inset-inline-end:20px;width:380px;max-width:calc(100vw - 32px);z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.25);max-height:calc(100vh - 80px);overflow:auto}
.qlog .item{font-size:13px}
.qlog .ok{color:var(--accent2)}.qlog .ng{color:var(--bad)}
.big{font-size:32px;font-weight:700;color:var(--accent)}
.aibar{border:1px dashed var(--accent);border-radius:10px;padding:10px 12px;margin-block-end:12px;background:color-mix(in srgb,var(--accent) 6%,var(--card))}
.chat .q{background:var(--soft);border-radius:10px;padding:10px 12px;margin:8px 0;max-width:92%}
.chat .a{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin:8px 0 8px auto;max-width:85%;color:var(--muted)}
.chat .q b{display:block;font-size:11px;color:var(--accent);margin-block-end:2px}
.gtable td{vertical-align:top}
.gtable .lvchg{font-weight:700}
.gtable .up{color:var(--accent2)}.gtable .dn{color:var(--bad)}
label.stepline{display:flex;gap:6px;align-items:flex-start;font-size:12px;margin:4px 0;color:var(--ink);cursor:pointer;flex:1}
label.stepline input{width:auto;margin-block-start:2px}
label.stepline.done .sp{text-decoration:line-through;color:var(--muted)}
.week label.stepline{font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;margin:0 0 6px}
.steprow{display:flex;gap:4px;align-items:flex-start}
footer{padding:18px 24px 28px;color:var(--muted);font-size:12px;border-block-start:1px solid var(--line);max-width:1200px}
footer a{color:var(--muted)}
.skrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-block-end:8px}
.req{color:var(--bad)}
.fhint{font-size:12px;color:var(--bad);margin-block-start:4px}
.fhint:empty{display:none}
.mini{font-size:12px;background:var(--soft);border-radius:8px;padding:6px 10px}
.pick .offmsg{font-size:12px;font-weight:700;color:var(--bad)}
/* ===== 版面整理：較柔和的卡片、較大的按鈕、清楚的焦點 ===== */
:root{--radius:14px;--shadow:0 1px 2px rgba(20,30,60,.06),0 6px 18px rgba(20,30,60,.07);--gold:#e9a320;--xp1:#7c5cff;--xp2:#2f6fde}
@media (prefers-color-scheme: dark){:root{--shadow:0 1px 2px rgba(0,0,0,.45),0 8px 22px rgba(0,0,0,.35);--gold:#f5c04a;--xp1:#9b85ff;--xp2:#6b9cff}}
body{font-size:14.5px}
.card{border-radius:var(--radius);box-shadow:var(--shadow);border-color:transparent;padding:18px 20px}
.rec{border-radius:12px;transition:box-shadow .15s,transform .15s}
.rec:hover{box-shadow:var(--shadow)}
.rolecard:hover,.pick:not(.off):hover{transform:translateY(-1px)}
.btn{border-radius:10px;min-height:34px;transition:transform .08s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.06)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.sm{min-height:28px;border-radius:8px}
.btn.lg{min-height:44px;border-radius:12px;padding:10px 22px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.sec>h2{font-size:18px}
/* 角色狀態列（HUD） */
header{align-items:center;padding-block-start:16px}
.hud{display:flex;align-items:center;gap:10px;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:5px 16px 5px 5px;cursor:pointer;border:0;font-family:inherit;color:var(--ink);text-align:start}
.hud .av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:21px;background:linear-gradient(135deg,var(--xp1),var(--xp2));flex:none}
.hud .lv{font-weight:800;font-size:13px;white-space:nowrap}
.hud .ttl{font-size:11px;color:var(--muted)}
.xpbar{width:130px;height:7px;border-radius:9px;background:var(--chip);overflow:hidden;margin:3px 0 1px}
.xpbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--xp1),var(--xp2));transition:width .7s cubic-bezier(.2,.8,.2,1)}
.hud .bd{font-size:12px;font-weight:800;color:var(--gold);white-space:nowrap}
/* 關卡式導覽 */
nav{gap:8px;padding:14px 24px 14px;border-block-end:0}
nav button{border:1px solid var(--line);border-radius:999px;padding:7px 14px;background:var(--card)}
nav button.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 4px 12px color-mix(in srgb,var(--accent) 35%,transparent)}
nav button.on .n,nav button.on.done .n{border-color:#fff;color:#fff;background:transparent}
/* 冒險地圖 */
.map{display:flex;align-items:flex-start;margin:14px 0 6px;overflow-x:auto;padding:6px 2px 8px}
.mnode{flex:1;min-width:84px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;cursor:pointer;background:none;border:0;font-family:inherit;color:var(--ink);padding:0 4px}
.mnode:not(:last-child)::after{content:"";position:absolute;top:30px;inset-inline-start:calc(50% + 34px);width:calc(100% - 68px);height:4px;border-radius:4px;background:var(--line)}
.mnode.done:not(:last-child)::after{background:var(--accent2)}
.mnode .orb{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:var(--chip);border:3px solid var(--line);position:relative;z-index:1;transition:transform .15s}
.mnode:hover:not(.lock) .orb{transform:scale(1.06)}
.mnode.done .orb{background:color-mix(in srgb,var(--accent2) 18%,var(--card));border-color:var(--accent2)}
.mnode.cur .orb{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--card));animation:pulse 1.8s ease-in-out infinite}
.mnode.lock{cursor:not-allowed}.mnode.lock .orb{opacity:.45;filter:grayscale(1)}
.mnode .ml{font-size:11px;color:var(--muted);margin-top:7px}.mnode .mn{font-weight:800;font-size:13px}
.mnode .ms{font-size:11px;margin-top:2px;color:var(--muted)}
.mnode.done .ms{color:var(--accent2);font-weight:700}.mnode.cur .ms{color:var(--accent);font-weight:700}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}50%{box-shadow:0 0 0 12px transparent}}
.hero{background:linear-gradient(135deg,color-mix(in srgb,var(--xp1) 13%,var(--card)),color-mix(in srgb,var(--accent2) 11%,var(--card)))}
.hero h2{font-size:22px!important;margin-bottom:6px!important}
.howto{display:grid;gap:10px}
.howto>div{display:flex;gap:10px;align-items:flex-start}
.howto .hi{font-size:22px;flex:none;width:34px;text-align:center}
.kpi{display:flex;gap:12px;align-items:center}
.kpi .ic{font-size:26px}
/* 成就 */
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.badge{border-radius:12px;padding:10px 8px;text-align:center;background:var(--soft)}
.badge .bi{font-size:28px;line-height:1.2}.badge .bn{font-weight:800;font-size:12px;margin-top:4px}.badge .bdsc{font-size:11px;color:var(--muted)}
.badge.locked{filter:grayscale(1);opacity:.42}
.ladder{display:flex;flex-wrap:wrap;gap:6px}
.ladder span{font-size:11px;border-radius:999px;padding:2px 8px;background:var(--chip);color:var(--muted)}
.ladder span.on{background:linear-gradient(90deg,var(--xp1),var(--xp2));color:#fff;font-weight:700}
/* 慶祝 */
.cele{position:fixed;inset-inline:0;top:16%;margin-inline:auto;width:min(360px,calc(100vw - 32px));z-index:50;text-align:center;background:var(--card);border-radius:20px;box-shadow:0 24px 70px rgba(0,0,0,.32);padding:24px 18px 20px;animation:pop .45s cubic-bezier(.2,1.4,.4,1);cursor:pointer}
.cele .ci{font-size:54px;line-height:1.1}.cele .ct{font-size:18px;font-weight:800;margin-top:8px}.cele .cd{color:var(--muted);font-size:13px;margin-top:4px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.confetti{position:fixed;top:-14px;width:8px;height:14px;border-radius:2px;z-index:49;pointer-events:none;animation:fall 1.7s ease-in forwards}
@keyframes fall{to{transform:translateY(106vh) rotate(560deg);opacity:.75}}
.xpfloat{position:fixed;z-index:51;font-weight:800;font-size:14px;color:var(--xp1);pointer-events:none;animation:floatup 1.1s ease-out forwards}
@keyframes floatup{to{transform:translateY(-40px);opacity:0}}
.week label.stepline{background:var(--card);transition:background .2s}
.week label.stepline:hover{background:var(--soft)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.hero h2{white-space:nowrap}
@media (max-width:620px){.xpbar{width:84px}.hud .tt{display:none}.mnode{min-width:0}.mnode .orb{width:44px;height:44px;font-size:20px;border-width:2px}.mnode:not(:last-child)::after{top:21px;inset-inline-start:calc(50% + 25px);width:calc(100% - 50px);height:3px}.mnode .ms{display:none}.mnode .mn{font-size:12px}
nav{flex-wrap:nowrap;overflow-x:auto;padding-inline:16px;scrollbar-width:none}nav button{flex:none}
#tab-dash .grid.g4{grid-template-columns:1fr 1fr;gap:10px}#tab-dash .kpi{padding:12px;gap:8px}#tab-dash .kpi .ic{font-size:20px}#tab-dash .kpi .n{font-size:22px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>🧭 個人成長導航系統</h1>
    <div class="sub" id="hdrSub">現況 → 目標 → 計畫 → 模擬</div>
  </div>
  <div id="hud"></div>
  <div class="row">
    <span class="small" id="saveStat"></span>
    <button class="btn ghost sm" id="btnShare">🤝 分享經驗</button>
    <button class="btn ghost sm" id="btnAI">⚙ AI 設定</button>
    <button class="btn ghost sm" id="btnExport">⬇ 匯出</button>
    <label class="btn ghost sm" style="margin:0">⬆ 匯入<input type="file" id="fileImport" accept=".json" class="hide"></label>
  </div>
</header>
<nav id="nav"></nav>
<main>
  <section id="tab-dash"></section>
  <section id="tab-now" class="hide"></section>
  <section id="tab-goal" class="hide"></section>
  <section id="tab-plan" class="hide"></section>
  <section id="tab-sim" class="hide"></section>
  <section id="tab-share" class="hide"></section>
</main>
<footer id="foot"></footer>
<div class="card panel hide" id="aiPanel"></div>
<div class="card panel hide" id="gamePanel"></div>
<div class="toast" id="toast"></div>
<script>
(function(){
"use strict";

const IMP={1:"低",2:"中",3:"高"};
const CAT=DATA.recommendations.catalog;
const TYPE={c:"證照",s:"技能",a:"能力",o:"專案機會"};
const STAT=[["todo","待開始"],["doing","進行中"],["review","驗收 / 待考"],["done","已完成"]];
// ===== 能力框架（Persona → 10 項能力）=====
// 共通核心 4 項：所有框架相同
const CORE=DATA.frameworks.core;
const CORE_IDS=CORE.map(function(c){return c.id;});
// 擁有者專用：自動化 / AI 顧問 14 項（原框架）
const AUTO_COMPS=DATA.frameworks.frameworks.automation.comps;
// 角色：d 一句定位、st 適合的階段（排序用）、tgt 目標等級
const FRAMEWORKS=DATA.frameworks.frameworks;
const TRACKS=DATA.frameworks.tracks;
const STAGE_LIST=DATA.frameworks.stages.map(function(s){return [s.id,s.n,s.d];});
const stageName=function(id){return (STAGE_LIST.find(function(s){return s[0]===id;})||[])[1]||"";};
// 推薦目錄（CAT）用的是舊 14 項能力 id；對應到新框架時用這張表
const CMAP=DATA.recommendations.catalogMap;
// 依目前框架派生的全域（applyFramework 設定）
let COMPS=[],ROLES={},ROLE_D={},CATX=[],TECH=[],BIZ=[],SOFT=[];
function fwComps(fw){return fw.full?fw.comps.slice():CORE.concat(fw.comps);}
function buildRoles(fw,stage){
  const R={},D={};
  Object.keys(fw.roles).forEach(function(r){const t=Object.assign({},fw.roles[r].tgt);
    if(!fw.full){Object.keys(t).forEach(function(k){if(stage==="junior")t[k]=Math.max(2,t[k]-1);if((stage==="exec"||stage==="expert")&&CORE_IDS.indexOf(k)>=0)t[k]=Math.min(5,t[k]+1);});}
    R[r]=t;D[r]=fw.roles[r].d;});
  return {R:R,D:D};
}
// 把推薦目錄翻譯成目前框架的能力 id；全部對不上的項目丟掉
function translateCat(fw){
  if(fw.ext)return (FW_RECS[fw.id]||[]).slice();
  if(fw.full)return CAT.slice();
  const ids=fwComps(fw).map(function(c){return c.id;});
  const mp=function(k){const m=CMAP[k]||k;return ids.indexOf(m)>=0?m:null;};
  const out=[];const own=FW_RECS[fw.id];
  CAT.forEach(function(it){
    if(it.type==="o"&&!fw.full)return; // 機會改由 genOpps() 依差距生成；擁有者框架保留手寫精選
    if(own&&it.type!=="o")return;
    const comps=[];it.comps.forEach(function(k){const m=mp(k);if(m&&comps.indexOf(m)<0)comps.push(m);});
    if(!comps.length)return;
    const x=Object.assign({},it,{comps:comps});
    if(it.req){const req={};Object.keys(it.req).forEach(function(k){const m=mp(k);if(m)req[m]=Math.max(req[m]||0,it.req[k]);});if(!Object.keys(req).length)return;x.req=req;}
    out.push(x);
  });
  return (own||[]).concat(out);
}
function applyFramework(d){
  const fw=FRAMEWORKS[d.fw];
  if(!fw){COMPS=[];ROLES={};ROLE_D={};CATX=[];TECH=[];BIZ=[];SOFT=[];return;}
  COMPS=fwComps(fw);
  // AI 客製：改名與等級描述，並附加自訂能力（第 11、12 項）
  if(d.custom){COMPS=COMPS.map(function(c){const x=d.custom.comps&&d.custom.comps[c.id];return x?Object.assign({},c,{n:x.n||c.n,lvd:(x.lvd&&x.lvd.length===5)?x.lvd:c.lvd}):c;}).concat((d.custom.extra||[]).map(function(e){return Object.assign({cat:"自訂"},e);}));}
  const br=buildRoles(fw,(d.profile.persona||{}).stage);ROLES=br.R;ROLE_D=br.D;
  if(d.customRoles&&d.customRoles.fw===d.fw){Object.keys(d.customRoles.roles).forEach(function(r){const x=d.customRoles.roles[r];const tg={};fwComps(fw).forEach(function(c){tg[c.id]=x.tgt[c.id]||3;});ROLES[r]=tg;ROLE_D[r]=x.d||"";});}
  const ids=COMPS.map(function(c){return c.id;});
  const ex=(d.profile.persona||{}).stage==="expert";
  CATX=translateCat(fw).map(function(it){return ex&&(it.tx||it.dx)?Object.assign({},it,{t:it.tx||it.t,d:it.dx||it.d}):it;}).concat(d.aiRecs&&d.aiRecs.fw===d.fw?d.aiRecs.items.filter(function(it){return it.comps.every(function(k){return ids.indexOf(k)>=0;});}):[]);
  if(fw.full){TECH=COMPS.filter(function(c){return c.cat==="技術";}).map(function(c){return c.id;});BIZ=COMPS.filter(function(c){return c.cat==="業務"||c.cat==="管理";}).map(function(c){return c.id;});SOFT=["comm","lead","change"];}
  else{TECH=COMPS.filter(function(c){return c.cat!=="核心";}).map(function(c){return c.id;});BIZ=["solve","exec"];SOFT=["comm","learn"];}
  const first=Object.keys(ROLES)[0];
  if(!ROLES[d.profile.target])d.profile.target=first;
  COMPS.forEach(function(c){d.lv[c.id]=Object.assign({cur:1,tgt:ROLES[d.profile.target][c.id]||3,imp:2,ev:"",rated:false},d.lv[c.id]||{});});
}
// 使用者在精靈選定 persona 後呼叫：切換框架、保留同 id 的既有評分
function setFramework(id){
  const prev=S.fw;S.fw=id;applyFramework(S);
  if(prev!==id){S.custom=null;applyFramework(S);S.setup.lv=COMPS.every(function(c){return S.lv[c.id].rated;});S.setup.target=false;}
  save();
}
// 各職類自己的推薦清單（證照 c / 技能 s / 能力 a）；tech 與 automation 沿用 CAT
const FW_RECS=DATA.recommendations.byTrack;
// 加入計畫時自動產生的起步清單：[步驟, 時數權重]
const STEP_TPL=DATA.templates.steps;
function mkSteps(type,h){const tpl=STEP_TPL[type]||STEP_TPL.s;const tot=tpl.reduce(function(a,x){return a+x[1];},0);const ex=isExpert();return tpl.map(function(x){return {id:uid(),t:ex&&x[2]?x[2]:x[0],h:Math.max(1,Math.round((h||10)*x[1]/tot)),done:false};});}
// ===== 框架包匯入 / 匯出（BACKLOG #5）=====
// 格式：{format:"growth-nav-framework",version:1,meta:{source,contributor,updated},framework:{name,eg,comps:[{id,n,cat,lvd[5]}],roles:{名稱:{d,st,tgt}},certs},recs:[{type,t,d,comps,h,lv}]}
function validatePack(j){
  if(!j||j.format!=="growth-nav-framework")return "不是框架包（format 應為 growth-nav-framework）";
  const f=j.framework;if(!f||!f.name||!Array.isArray(f.comps))return "缺少 framework.name 或 comps";

function makeOpp(tpl,k,more){

  const ks=[k].concat((more||[]).filter(function(x){return x!==k&&COMPS.some(function(c){return c.id===x;});}));

  const tr=(S.profile.persona||{}).track||"tech";const sc=(OPP_SCENE[tpl]||{})[tr]||(OPP_SCENE[tpl]||{}).tech||"";
  const ids=COMPS.map(function(x){return x.id;});
  const comps=[];ks.forEach(function(kk){T.trains(kk).forEach(function(x){if(x&&ids.indexOf(x)>=0&&comps.indexOf(x)<0)comps.push(x);});});
  const req={};const rq=T.req(k);Object.keys(rq).forEach(function(x){if(x&&x!=="null"&&ids.indexOf(x)>=0)req[x]=rq[x];});
  if(!Object.keys(req).length)req[k]=1;

}
function genOpps(lv){

  let gs=COMPS.map(function(c){const v=S.lv[c.id],g=Math.max(0,v.tgt-lv[c.id].cur);return {k:c.id,g:g,p:g*v.imp};}).filter(function(x){return x.g>0;}).sort(function(a,b){return b.p-a.p||b.g-a.g;});

}

function weekTasks(){
  const budget=Math.max(1,Number(S.profile.hours||5));const order={doing:0,review:1,todo:2};
  const items=S.plan.map(function(p,i){return {p:p,i:i};}).filter(function(x){return x.p.st!=="done"&&x.p.steps&&x.p.steps.some(function(z){return !z.done;});}).sort(function(a,b){return (order[a.p.st]-order[b.p.st])||(a.p.due||"9999").localeCompare(b.p.due||"9999")||(a.i-b.i);});
  const out=[];let used=0;
  items.some(function(x){const st=x.p.steps.find(function(z){return !z.done;});if(out.length&&used+st.h>budget*1.5)return false;out.push({p:x.p,s:st});used+=st.h;return out.length>=3||used>=budget;});
  return {tasks:out,used:used,budget:budget};
}

function simScore(run,it){let sc=0;it.comps.forEach(function(k){sc+=Math.max(0,S.lv[k].tgt-run.lv[k].cur)*S.lv[k].imp;});return (sc+0.5)/Math.sqrt(Math.max(1,it.h)/20);}
// 每季出 4 張行動卡 + 休養：進行中的優先，其餘依「差距×重要度÷成本」排序並盡量分散類型
function dealCards(run){
  const pool=CATX.concat(genOpps(run.lv));
  const cands=pool.filter(function(it,i){if(pool.findIndex(function(x){return x.id===it.id;})!==i)return false;if(run.done.indexOf(it.id)>=0||run.heldC.indexOf(it.id)>=0)return false;if(it.type==="o")return readinessIn(run.lv,it).pct>=70;return true;});
  const inprog=cands.filter(function(it){return run.inProgress[it.id];});
  const rest=cands.filter(function(it){return !run.inProgress[it.id];}).sort(function(a,b){return simScore(run,b)-simScore(run,a);});
  const pick=inprog.slice(0,2);
  ["c","s","a","o","c","s","a","o"].forEach(function(t){if(pick.length>=4)return;const x=rest.find(function(r){return r.type===t&&pick.indexOf(r)<0;});if(x)pick.push(x);});
  rest.forEach(function(x){if(pick.length<4&&pick.indexOf(x)<0)pick.push(x);});
  return pick.concat([REST]);
}
function judgeRules(run,it){
  if(it.type==="r")return {p:1,src:"rules"};
  const avg=avgLv(run.lv,it.comps),need=it.lv||3;
  let p=0.4+0.12*(avg-need)+0.001*run.stats.depth;
  if(it.type==="o"){p+=0.002*run.stats.impact+(readinessIn(run.lv,it).pct-60)/250;}
  if(it.type==="a")p+=0.002*run.stats.vis;
  if(run.stats.energy<30)p-=0.2;
  if(run.inProgress[it.id])p+=0.25;
  return {p:clamp(p,0.1,0.9),src:"rules"};
}

function judgeClaude(run,it){

function judge(run,it){
  const base=judgeRules(run,it);if(it.type==="r")return Promise.resolve(base);
  let p=null;
  if(S.ai.provider==="claude"&&S.ai.claudeKey)p=judgeClaude(run,it);
  else if(S.ai.provider==="jev"&&S.ai.jevKey)p=judgeJev(run,it);
  if(!p)return Promise.resolve(base);
  // AI 機率與規則機率各半混合，避免單一來源極端值

}
function templateNarr(run,step){
  const ok=step.results.filter(function(r){return r.ok&&r.type!=="r";}).map(function(r){return "「"+r.t+"」";});
  const ng=step.results.filter(function(r){return !r.ok;}).map(function(r){return "「"+r.t+"」";});
  const rest=step.results.some(function(r){return r.type==="r";});
  let s="第 "+step.q+" 季：";
  if(ok.length)s+="完成 "+ok.join("、")+"。";
  if(ng.length)s+=ng.join("、")+" 進度落後，下季可再接續。";
  if(rest)s+="這一季刻意放慢腳步，精力回升。";

  return s;
}

  const q="你是職涯模擬遊戲的旁白。請用繁體中文、第二人稱、2–3 句話，把這一季的經歷寫成像人生紀錄般有畫面的短文，不要列點、不要加標題。\n本季事實："+tpl+"\n目前狀態："+JSON.stringify(run.stats)+"\n目標角色："+S.profile.target;

function resolveQuarter(run){
  const cards=dealCards(run);
  let picks=run.picked.map(function(id){return cards.find(function(c){return c.id===id;});}).filter(Boolean);
  if(!picks.length)picks=[REST];
  const results=[];const before=Object.assign({},run.stats);
  return picks.reduce(function(chain,it){return chain.then(function(){return judge(run,it).then(function(j){
    const ok=roll(run)<j.p;
    if(it.type==="r"){run.stats.energy+=30;}
    else{
      run.stats.energy-=energyCost(it);
      if(ok){
        // 主要能力 +0.4、次要 +0.2；已達 4 級以上成長減半（越高越難進步）
        it.comps.forEach(function(k,i){const g=(i===0?0.4:0.2)*(run.lv[k].cur>=4?0.5:1);run.lv[k].cur=Math.min(5,Math.round((run.lv[k].cur+g)*10)/10);});
        run.done.push(it.id);delete run.inProgress[it.id];
        if(it.type==="c"){run.stats.depth+=2;run.heldC.push(it.id);}
        if(it.type==="s")run.stats.depth+=2;
        if(it.type==="a"){run.stats.impact+=2;run.stats.vis+=2;}
        if(it.type==="o"){run.stats.impact+=5;run.stats.vis+=3;}
      }else{run.inProgress[it.id]=(run.inProgress[it.id]||0)+0.5;run.stats.depth+=1;}
    }
    results.push({id:it.id,t:it.t,type:it.type,ok:ok,p:Math.round(j.p*100),src:j.src,reason:j.reason||""});
  });});},Promise.resolve()).then(function(){
    run.stats.energy+=15;
    const ev=rollEvent(run);
    clampStats(run);
    run.q++;
    const step={q:run.q,actions:picks.map(function(p){return p.id;}),results:results,event:ev,narrative:"",statsBefore:before};
    return narrate(run,step).then(function(n){step.narrative=n;run.steps.push(step);run.picked=[];if(run.q>=QMAX)finishRun(run);save();});
  });
}

  if(t.id==="btnGrillQuit"){grill=null;nowStep=1;render();return;}
  if(t.id==="btnGrillApply"){grillApply();return;}
  if(t.id==="btnAddCert"){const v=$("#certT").value.trim();if(!v){toast("請輸入證照名稱");return;}S.certs.push({id:uid(),t:v,y:$("#certY").value.trim()});syncCerts(S);save();render();return;}
  if(t.dataset.dcert){S.certs=S.certs.filter(function(c){return c.id!==t.dataset.dcert;});syncCerts(S);save();render();return;}
  if(t.id==="btnNow2"){nowStep=3;render();return;}
  if(t.id==="btnAddExp"){const v=$("#expT").value.trim();if(!v){toast("請輸入經歷名稱");return;}const d=$("#expD").value.trim(),c=$("#expC").value;S.exps.push({id:uid(),t:v,d:d,c:c});const ev=v+(d?"（"+d+"）":"");S.lv[c].ev=S.lv[c].ev?S.lv[c].ev+"；"+ev:ev;save();render();return;}
  if(t.dataset.dexp){S.exps=S.exps.filter(function(x){return x.id!==t.dataset.dexp;});save();render();return;}
  if(t.id==="btnNow3"){markProfile();S.setup.evidence=true;save();nowStep=4;render();toast("現況設定完成！接著選目標角色");return;}
  // ② 目標
  if(t.id==="btnOppAll"){oppAll=!oppAll;render();return;}
  if(t.id==="btnRMAll"){rmAll=!rmAll;render();return;}
  if(t.id==="btnRMClear"){S.roleModel="";rmAll=false;applyTargets();save();render();toast("已取消 role model，目標回到角色預設");return;}
  if(t.id==="btnRMAct"){const r=getRM();if(!r||inPlan("rm_"+r.id))return;const w=rmWeights(r);const top=Object.keys(w).sort(function(a,b){return w[b]-w[a];});const p=newPlanItem({id:"rm_"+r.id,type:"a",t:"向 "+r.n.split(" ")[0]+" 學："+r.act,comps:top.slice(0,2).length?top.slice(0,2):[COMPS[0].id],h:5});S.plan.push(p);openItems[p.id]=true;save();render();toast("已加入計畫");return;}
  if(t.id==="btnRMAI"){if(aiBusy)return;const nm=($("#rmName")||{}).value||"";if(!nm.trim()){toast("請輸入人物名字");return;}aiBusy="rm";render();aiRoleModel(nm.trim()).then(function(r){toast("已產生並套用「"+r.n+"」");}).catch(function(e){toast("AI 產生失敗："+(e.message||e).toString().slice(0,60));}).then(function(){aiBusy=false;render();});return;}
  if(t.id==="btnAINewOpp"){if(aiBusy)return;aiBusy="newopp";render();aiNewOpps().then(function(n){oppAll=true;toast("AI 新增 "+n+" 個機會（標 ✨ AI 產生）");}).catch(function(e){toast("AI 新增失敗："+(e.message||e).toString().slice(0,60));}).then(function(){aiBusy=false;render();});return;}
  if(t.id==="btnAIRole"){if(aiBusy)return;const nm=($("#aiRoleName")||{}).value||"";if(!nm.trim()){toast("請輸入想成為的角色名稱");return;}aiBusy="role";render();aiRole(nm.trim()).then(function(r){toast("已產生並套用角色「"+r+"」");}).catch(function(e){toast("AI 產生失敗："+(e.message||e).toString().slice(0,60));}).then(function(){aiBusy=false;render();});return;}
  if(t.dataset.delrole){const r=t.dataset.delrole;if(!window.confirm("刪除 AI 產生的角色「"+r+"」？"))return;delete S.customRoles.roles[r];applyFramework(S);if(S.profile.target===r||!ROLES[S.profile.target]){S.profile.target=Object.keys(ROLES)[0];applyTargets();}save();render();return;}
  if(t.id==="btnAIOpp"){if(aiBusy)return;aiBusy="opp";render();aiOppText(oppList().slice(0,oppAll?99:5)).then(function(n){toast("AI 已改寫 "+n+" 個機會");}).catch(function(e){toast("AI 改寫失敗："+(e.message||e).toString().slice(0,60));}).then(function(){aiBusy=false;render();});return;}
  if(t.dataset.pitch){pitchId=t.dataset.pitch;render();return;}
  if(t.id==="btnCopy"){const txt=$("#pitchTxt").textContent;const sel=function(){const r=document.createRange();r.selectNodeContents($("#pitchTxt"));const s=window.getSelection();s.removeAllRanges();s.addRange(r);toast("已選取文字，請按 Ctrl+C 複製");};try{navigator.clipboard.writeText(txt).then(function(){toast("已複製");},sel);}catch(x){sel();}return;}
  // ③ 計畫
  if(t.dataset.add){addPlan(t.dataset.add);return;}
  if(t.dataset.rf){recFilter=t.dataset.rf;render();return;}
  if(t.id==="btnRecAll"){recAll=!recAll;render();return;}
  if(t.id==="btnLogOpen"){logOpen=!logOpen;logPreset="";render();return;}
  if(t.dataset.del){S.plan=S.plan.filter(function(p){return p.id!==t.dataset.del;});save();render();return;}
  if(t.dataset.mv){const p=S.plan.find(function(x){return x.id===t.dataset.mv;});const to=t.dataset.to,st=p.steps||[];
    if(to==="done"){st.forEach(function(x){x.done=true;});completeItem(p);}
    else{if(p.st==="done"&&st.length)st[st.length-1].done=false;p.st=to;if(st.length)p.pg=Math.round(st.filter(function(x){return x.done;}).length/st.length*100);else if(p.pg===100)p.pg=90;}
    save();render();return;}
  if(t.id==="btnPlanRebuild"){const st=S.plan.filter(planStale);if(!window.confirm("會移除 "+st.length+" 個來自舊角色的未完成項目，確定？"))return;S.plan=S.plan.filter(function(p){return !planStale(p);});save();render();toast("已清空舊角色的項目，從下方推薦重新加入吧");const r=[...document.querySelectorAll("#tab-plan .sec h2")].find(function(x){return x.textContent.indexOf("推薦")>=0||x.textContent.indexOf("再加入")>=0;});if(r)r.scrollIntoView({block:"start"});return;}
  if(t.id==="btnPlanKeep"){S.plan.filter(planStale).forEach(function(p){p.keepOld=true;p.oldLabel=p.fw?fwName(p.fw):"較早版本";});save();render();toast("已保留並標示為「來自舊角色」");return;}
  if(t.id==="btnPlanReeval"){const ids=COMPS.map(function(c){return c.id;});let ok=0,bad=0;S.plan.filter(planStale).forEach(function(p){const nc=[];p.comps.forEach(function(k){const m=ids.indexOf(k)>=0?k:(CMAP[k]&&ids.indexOf(CMAP[k])>=0?CMAP[k]:null);if(m&&nc.indexOf(m)<0)nc.push(m);});if(nc.length){p.comps=nc;p.fw=S.fw;p.role=S.profile.target;p.unmapped=false;ok++;}else{p.keepOld=true;p.unmapped=true;p.oldLabel=p.fw?fwName(p.fw):"較早版本";bad++;}});save();render();toast("重新評估：保留並更新 "+ok+" 項"+(bad?"，"+bad+" 項對應不到新框架（已標出，可自行刪除）":""));return;}
  if(t.dataset.openitem){openItems[t.dataset.openitem]=!openItems[t.dataset.openitem];render();return;}
  if(t.dataset.addstep){const p=S.plan.find(function(x){return x.id===t.dataset.addstep;});const v=($("#addStep-"+p.id)||{}).value||"";if(!v.trim()){toast("請輸入步驟內容");return;}p.steps.push({id:uid(),t:v.trim(),h:Math.max(1,Number(($("#addStepH-"+p.id)||{}).value)||2),done:false});syncPg(p);save();render();const nx=$("#addStep-"+p.id);if(nx)nx.focus();return;}
  if(t.dataset.dstep){const k=t.dataset.dstep.split("|");const p=S.plan.find(function(x){return x.id===k[0];});p.steps=p.steps.filter(function(x){return x.id!==k[1];});syncPg(p);save();render();return;}
  if(t.dataset.aisteps){if(aiBusy)return;const p=S.plan.find(function(x){return x.id===t.dataset.aisteps;});if(p.steps.some(function(x){return !x.done;})&&!window.confirm("會用 AI 的版本取代尚未完成的步驟（已完成的保留），確定？"))return;aiBusy=p.id;render();aiSteps(p).then(function(n){toast("AI 已拆解成 "+n+" 個步驟");}).catch(function(e){toast("AI 拆解失敗，維持原步驟："+(e.message||e).toString().slice(0,60));}).then(function(){aiBusy=false;render();});return;}
  if(t.id==="btnAIRec"){if(aiBusy)return;aiBusy="rec";render();aiRecommend().then(function(n){recFilter="all";toast("AI 新增 "+n+" 項推薦（標 ✨）");}).catch(function(e){toast("AI 推薦失敗："+(e.message||e).toString().slice(0,60));}).then(function(){aiBusy=false;render();});return;}
  if(t.id==="btnReviewOpen"||t.id==="btnGoReview"){logOpen=true;logPreset="季度回顧";show("plan");setTimeout(function(){const ta=$("#lTxt");if(ta){ta.scrollIntoView({block:"center"});ta.focus();}},50);return;}
  if(t.dataset.dlog){S.log=S.log.filter(function(l){return l.id!==t.dataset.dlog;});save();render();return;}
  if(t.id==="btnCustom"){const ti=$("#cTitle").value.trim();if(!ti){toast("請輸入名稱");return;}const p=newPlanItem({type:$("#cType").value,t:ti,comps:[$("#cComp").value],h:Number($("#cHours").value)||30});S.plan.push(p);openItems[p.id]=true;save();render();toast("已加入計畫，並產生起步清單");return;}
  if(t.id==="btnLog"){const tx=$("#lTxt").value.trim();if(!tx){toast("請輸入內容");return;}const c=$("#lComp").value;const ty=$("#lType").value;S.log.push({id:uid(),d:$("#lDate").value||today(),ty:ty,c:c,t:tx});if(c&&$("#lEv").checked){S.lv[c].ev=S.lv[c].ev?S.lv[c].ev+"；"+tx:tx;}if(ty==="季度回顧")S.lastReview=$("#lDate").value||today();logOpen=false;logPreset="";save();render();toast(ty==="季度回顧"?"季度回顧完成，下次提醒在 90 天後":"已記錄");return;}
  // ④ 模擬
  if(t.id==="btnNewSim"){const run=newRun($("#simName").value.trim());S.sims.push(run);simView=run.id;save();render();toast("新的一局開始了，先選這一季要做的事");return;}
  if(t.dataset.open){simView=t.dataset.open;render();return;}
  if(t.dataset.dsim){if(window.confirm("確定刪除這一局？")){S.sims=S.sims.filter(function(r){return r.id!==t.dataset.dsim;});cmpSel=cmpSel.filter(function(x){return x!==t.dataset.dsim;});save();render();}return;}
  if(t.id==="btnSimBack"){simView=null;render();return;}
  if(t.id==="btnResolve"){const run=curRun();if(!run||simBusy)return;simBusy=true;render();resolveQuarter(run).catch(function(e){toast("結算失敗："+(e.message||e));}).then(function(){simBusy=false;render();if(run.status==="done")toast("5 年走完了，來看看你的職涯紀錄卡");});return;}
  if(t.id==="btnExportPlan"){const run=curRun();if(!run)return;let n=0;run.done.forEach(function(id){const it=findItem(id);if(it&&!inPlan(id)){S.plan.push(newPlanItem(it,{next:"來自模擬「"+run.name+"」"}));n++;}});save();toast(n?"已把 "+n+" 個項目加入計畫":"這些項目都已在計畫中");if(n)show("plan");return;}
});
main.addEventListener("change",function(e){
  const t=e.target;
  if(t.id==="useAuto"){S.profile.persona.auto=t.checked;save();return;}
  if(t.dataset.sh){shDraft()[t.dataset.sh]=t.value;save();return;}
  if(t.dataset.shs){const k=t.dataset.shs.split("|");shDraft().skills[Number(k[0])][k[1]]=k[1]==="lv"?Number(t.value):t.value;save();return;}
  if(t.dataset.shc){shDraft()[t.dataset.shc]=t.checked;save();return;}
  if(t.id==="fwImport"){const f=t.files&&t.files[0];if(f)importPack(f);t.value="";return;}
  if(t.dataset.p){S.profile[t.dataset.p]=t.value;markProfile();save();return;}
  if(t.dataset.cmp){const id=t.dataset.cmp;if(t.checked){if(cmpSel.indexOf(id)<0)cmpSel.push(id);}else cmpSel=cmpSel.filter(function(x){return x!==id;});render();return;}
  if(t.dataset.lv){S.lv[t.dataset.lv][t.dataset.f]=Number(t.value);save();render();return;}
  if(t.dataset.step){const k=t.dataset.step.split("|");const p=S.plan.find(function(x){return x.id===k[0];});if(!p)return;const st=p.steps.find(function(x){return x.id===k[1];});if(!st)return;st.done=t.checked;const rc=t.getBoundingClientRect();syncPg(p);save();render();if(t.checked)floatXP(rc,"+15 XP");return;}
  if(t.dataset.due){S.plan.find(function(x){return x.id===t.dataset.due;}).due=t.value;save();return;}
  if(t.dataset.next){S.plan.find(function(x){return x.id===t.dataset.next;}).next=t.value;save();return;}
});
// 邊打邊存，不重畫（#12）
main.addEventListener("input",function(e){
  const t=e.target;
  if(t.dataset.p){S.profile[t.dataset.p]=t.value;markProfile();save();updateHints();return;}
  if(t.dataset.sh){shDraft()[t.dataset.sh]=t.value;save();return;}
  if(t.dataset.shs){const k=t.dataset.shs.split("|"),sk=shDraft().skills[Number(k[0])];if(sk){sk[k[1]]=k[1]==="lv"?Number(t.value):t.value;save();}return;}
});
main.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.ctrlKey&&e.target.id==="grillA"){e.preventDefault();$("#btnGrillSend").click();return;}
  if(e.key!=="Enter"||e.target.tagName!=="INPUT")return;
  if(e.target.id==="certT"||e.target.id==="certY"){e.preventDefault();$("#btnAddCert").click();}
  if(e.target.id==="rmName"){e.preventDefault();$("#btnRMAI").click();}
  if(e.target.id==="aiRoleName"){e.preventDefault();$("#btnAIRole").click();}
  if(e.target.id.indexOf("addStep")===0){e.preventDefault();const b=document.querySelector('[data-addstep="'+e.target.id.replace(/^addStepH?-/,"")+'"]');if(b)b.click();}
  if(e.target.id==="expT"||e.target.id==="expD"){e.preventDefault();$("#btnAddExp").click();}
  if(e.target.id==="simName"){e.preventDefault();$("#btnNewSim").click();}
});
$("#btnShare").addEventListener("click",function(){flushInputs();show("share");});
function toggleGame(){const gp=$("#gamePanel");if(gp.classList.contains("hide")){rGame();gp.classList.remove("hide");$("#aiPanel").classList.add("hide");}else gp.classList.add("hide");}
$("#hud").addEventListener("click",function(e){if(e.target.closest("#btnHud")){flushInputs();toggleGame();}});
$("#gamePanel").addEventListener("click",function(e){if(e.target.closest("#btnGameClose"))$("#gamePanel").classList.add("hide");});
$("#foot").addEventListener("click",function(e){if(e.target.id==="footShare"){e.preventDefault();show("share");}});

$("#aiPanel").addEventListener("click",function(e){
  const t=e.target.closest("button");if(!t)return;
  if(t.id==="btnAIClose"){$("#aiPanel").classList.add("hide");return;}
  if(t.id==="btnAISave"||t.id==="btnAITest"){
    S.ai.provider=$("#aiProv").value;S.ai.claudeKey=$("#aiClaudeKey").value.trim();S.ai.jevKey=$("#aiJevKey").value.trim();S.ai.model=$("#aiModel").value;S.ai.narrative=$("#aiNarr").checked;
    aiWarned=false;save();
    if(t.id==="btnAISave"){toast("AI 設定已儲存");$("#aiPanel").classList.add("hide");render();}else testAI();
  }
});
$("#btnExport").addEventListener("click",function(){const out=Object.assign({},S,{ai:Object.assign({},S.ai,{claudeKey:"",jevKey:""})});const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:"application/json"}));a.download="我的成長系統_"+today()+".json";document.body.appendChild(a);a.click();a.remove();dirty=false;stat();toast("已匯出，下次可用「匯入」接續");});
$("#fileImport").addEventListener("change",function(e){const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.addEventListener("load",function(){try{const d=JSON.parse(rd.result);if(!d.lv||!d.profile)throw new Error("bad");clearCele();const keys={claudeKey:S.ai.claudeKey,jevKey:S.ai.jevKey};S=migrate(d);if(!S.ai.claudeKey)S.ai.claudeKey=keys.claudeKey;if(!S.ai.jevKey)S.ai.jevKey=keys.jevKey;nowStep=null;save();show("dash");toast("匯入成功");}catch(x){toast("檔案格式不正確");}});rd.readAsText(f);e.target.value="";});
show(ready()?"dash":"dash");stat();rFoot();
})();
